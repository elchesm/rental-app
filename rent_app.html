<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동거동락 임대관리앱 — 새 주소로 이동</title>
<meta http-equiv="refresh" content="3;url=https://elchesm.github.io/rental-app/">
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; background:#F8FAFC; color:#1E293B;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px; }
  .card { background:#fff; border-radius:16px; padding:32px 24px; max-width:360px; text-align:center;
          box-shadow:0 4px 16px rgba(0,0,0,0.08); }
  h1 { font-size:20px; margin:0 0 12px; }
  p { font-size:14px; line-height:1.7; color:#475569; margin:0 0 20px; }
  a.btn { display:block; background:#2563EB; color:#fff; text-decoration:none; font-weight:700;
          padding:14px; border-radius:10px; font-size:16px; }
  .hint { font-size:12px; color:#94A3B8; margin-top:16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🏠 앱이 새 주소로 이사했어요</h1>
    <p>이 화면(예전 버전)은 더 이상 사용하지 않아요.<br>
       3초 뒤 자동으로 새 앱으로 이동합니다.<br>
       이동하지 않으면 아래 버튼을 눌러 주세요.</p>
    <a class="btn" href="https://elchesm.github.io/rental-app/">새 앱 열기</a>
    <p class="hint">💡 홈 화면 아이콘도 새 앱에서 다시 추가해 주세요.<br>(공유 → 홈 화면에 추가)</p>
  </div>
  <script>
    setTimeout(function(){ location.replace('https://elchesm.github.io/rental-app/'); }, 3000);
  </script>
</body>
</html>
